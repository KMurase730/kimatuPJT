<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>躰道とは</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
    <div class="hero-overlay">
        <h1>まだ知らない武道、躰道。</h1>

        <p>
            蹴る、跳ぶ、ひねる。<br>
            自由で美しい動きを生み出す、唯一無二の武道。
        </p>

        <a href="#about" class="hero-btn">躰道について知る</a>
    </div>
</section>

<section id="about" class="about">

    <h2>躰道とは</h2>

    <p>
        躰道（たいどう）は1965年に空手から派生した武道です。<br>
        「体軸の変化」を特徴とし、旋・運・変・捻・転という5つの操体を
        活かした三次元的で美しい動きを行います。
    </p>

</section>

<section class="competition">

    <h2>3つの競技</h2>

    <div class="card-container">

        <div class="card">
            <img src="image/houkei.jpg" alt="法形">
            <h3>法形</h3>
            <p>技の正確さや力強さ、美しさを競う競技です。</p>
            <a href="houkei.html">詳しく見る</a>
        </div>

        <div class="card">
            <img src="image/taidojissen.jpg" alt="実戦">
            <h3>実戦</h3>
            <p>一対一で技を競い合う躰道の対戦競技です。</p>
            <a href="jissen.html">詳しく見る</a>
        </div>

        <div class="card">
            <img src="image/tenkai.jpg" alt="展開">
            <h3>展開</h3>
            <p>5人の敵を倒す、躰道ならではの演武競技です。</p>
            <a href="tenkai.html">詳しく見る</a>
        </div>

    </div>

</section>

<section class="soutai">

    <h2>5つの操体</h2>

    <div class="soutai-box">

        <div>旋</div>
        <div>運</div>
        <div>変</div>
        <div>捻</div>
        <div>転</div>

    </div>
</br>
    <a class="hero-btn" href="soutai.html">
        操体について詳しく見る
    </a>

</section>

</body>
</html>
